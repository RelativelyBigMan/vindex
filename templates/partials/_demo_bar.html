{# Test-network tools. Rendered only when DEMO_MODE is on; the endpoints refuse otherwise. #}
<aside class="demo-bar" aria-label="Test network tools" data-demo-bar>
  <div class="container demo-bar__inner">
    <span class="demo-bar__label">{{ escrow_config.network.name|lower }}</span>
    <span>test funds only</span>
    <span class="demo-bar__spacer"></span>
    <div class="demo-bar__group">
      <button type="button" class="chip" data-run-bot title="Return every deposit whose automatic return date has passed">Run bot now</button>
      <a href="{% url 'escrow:stage' %}">Presenter view</a>
    </div>
  </div>
</aside>
