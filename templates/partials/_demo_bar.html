{# Demo tools. Rendered only when DEMO_MODE is on; every button calls a /api/demo/ endpoint that refuses otherwise. #}
<aside class="demo-bar" aria-label="Demo tools" data-demo-bar>
  <div class="container demo-bar__inner">
    <span class="demo-bar__label">demo</span>
    <div class="demo-bar__group" data-demo-personas aria-label="Act as"></div>
    <span class="demo-bar__spacer"></span>
    <div class="demo-bar__group">
      <button type="button" class="chip" data-run-bot title="Return every deposit whose automatic return date has passed">Run bot now</button>
      <span>{{ escrow_config.network.name }}</span>
      <a href="{% url 'escrow:demo' %}">Personas</a>
      <a href="{% url 'escrow:stage' %}">Stage</a>
    </div>
  </div>
</aside>
